name: gate

# The heavy checks of one head: the gate comparison against its base, the render check, the selftests, the harness
# selftest on Linux and on Windows, and the parity check. The log is public, so scripts/research/ci-checks.sh writes
# each check's output to a file and prints only PASS, FAIL or SKIP and the check's name; no step prints, uploads or
# caches a record, a quote or a path.
#
# The events are a push by a collaborator and a manual dispatch. There is no pull_request trigger: a pull request
# opened by anyone outside the team starts nothing. A push checks the head it pushed against the commit before it, or
# against the merge-base of main for a new branch. A dispatch names the branch (--ref) and, with the base input, the
# commit it is compared with; scripts/rq land and scripts/rq merge dispatch it for a head that is not a push.
#
# Actions are pinned by commit; the comment names the tag. Python and Node are set, not the runner's default.

on:
  push:
  workflow_dispatch:
    inputs:
      base:
        description: "the commit to compare with (40 hex); empty: the merge-base of main and the dispatched branch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: base
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
          BEFORE: ${{ github.event.before }}
        run: echo "ref=$(sh .github/base-commit.sh)" >> "$GITHUB_OUTPUT"

      - name: the gate comparison, the render check and the selftests
        env:
          BASE: ${{ steps.base.outputs.ref }}
          # the pin check, when the head moves the pin, asks the public API; the token only raises its rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -q strace > /dev/null 2>&1 || true
          git config --global user.email "gate@localhost"
          git config --global user.name "gate"
          sh scripts/research/ci-checks.sh linux "$BASE"

  harness-windows:
    # The failures that matter most on Windows (a rename with an open handle, LK_LOCK giving up, os.replace onto an
    # open file, text-mode pipes, the cost of MSYS process starts) exist only there. The script prints SKIP when the
    # harness did not change against the base.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: base
        id: base
        shell: bash
        env:
          INPUT_BASE: ${{ inputs.base }}
          BEFORE: ${{ github.event.before }}
        run: echo "ref=$(sh .github/base-commit.sh)" >> "$GITHUB_OUTPUT"

      - name: the harness's Windows cases and the load test
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          git config --global user.email "gate@localhost"
          git config --global user.name "gate"
          sh scripts/research/ci-checks.sh windows "$BASE"

  parity:
    # fr.py re-implements the public Worker's ranking, text rules and SQL guard; this runs both on the same inputs,
    # and checks the public parity fixture (site/worker/test/parity.json) when the pinned commit has one. The
    # public commit is pinned in scripts/fshy/public.lock, so a change merged in the public repository cannot turn
    # this job red for an unrelated pull request here; the pull request that moves the pin changes the twin too.
    # The public repository is public, so the checkout needs no token.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: the pinned public commit
        id: pin
        run: |
          sha=$(sed -n 's/^commit \([0-9a-f]\{40\}\)$/\1/p' scripts/fshy/public.lock)
          if [ -z "$sha" ]; then echo "scripts/fshy/public.lock has no 'commit <40 hex>' line"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "public commit $sha (scripts/fshy/public.lock)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: f-shy/fshy.ajam.dev
          ref: ${{ steps.pin.outputs.sha }}
          path: .tmp/public
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: fr selftest with the Worker parity required
        env:
          FSHY_PUBLIC: .tmp/public
        run: sh scripts/research/ci-checks.sh parity
